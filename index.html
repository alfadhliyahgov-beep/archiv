<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c6e">
<title>أرشيفي</title>
<style>
:root{--bg:#eef1f4;--fg:#14202b;--mut:#5d6b78;--card:#fff;--line:#d6dde4;--acc:#0f5c6e;--on:#fff;--tab:#f0c64a;--tabfg:#3a2d00;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--fg:#e8eef3;--mut:#9aa8b4;--card:#18222b;--line:#2a3743;--acc:#5cc3d9;--on:#062a33;--tab:#d9b03a;--tabfg:#241b00;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171d;--fg:#e8eef3;--mut:#9aa8b4;--card:#18222b;--line:#2a3743;--acc:#5cc3d9;--on:#062a33;--tab:#d9b03a;--tabfg:#241b00;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;padding:14px 14px 96px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 8px}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
button{border:0;border-radius:10px;padding:11px 14px;background:var(--acc);color:var(--on);font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.doc{display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;text-align:start;background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:400;padding:10px}
.doc img{width:64px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.doc b{display:block}.doc small{color:var(--mut)}
.tag{display:inline-block;background:var(--tab);color:var(--tabfg);font-size:13px;font-weight:700;padding:1px 10px;border-radius:8px 8px 0 0;margin-bottom:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.chips button{flex:none;padding:6px 12px;font-size:14px}
.mut{color:var(--mut);font-size:14px}.big{width:100%;margin-bottom:10px;padding:16px}
img.full{width:100%;border-radius:10px;border:1px solid var(--line);margin:8px 0}
#nav{position:fixed;inset:auto 0 0 0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#nav button{flex:1;background:transparent;color:var(--mut);padding:10px 4px;border-radius:8px}
#nav button.on{color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
.pick{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
label.btn{display:block;position:relative;overflow:hidden;text-align:center;border-radius:10px;background:var(--acc);color:var(--on);font-weight:600;cursor:pointer}
label.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}

<div id="app"></div>

<script>
try{document.documentElement.dir="rtl";document.documentElement.lang="ar"}catch(e){}
const DEF=[
{name:'فاتورة',kw:['فاتورة','invoice','المبلغ الاجمالي','total','الضريبة']},
{name:'عقد',kw:['عقد','اتفاقية','contract','الطرف الاول','الطرف الثاني']},
{name:'هوية ووثائق شخصية',kw:['هوية','جواز','passport','بطاقة','الرقم الوطني','شهادة الجنسية']},
{name:'كتاب رسمي',kw:['كتاب رسمي','الموضوع','م/','الى السيد','وزارة','دائرة']},
{name:'إيصال',kw:['ايصال','وصل','receipt','تم استلام','قبض']},
{name:'طبي',kw:['تقرير طبي','وصفة','مريض','طبيب','مستشفى']}];
const NONE='غير مصنف';
let docs=[],cats=[],tab='list',openId=null,q='',fc='',sortBy='date',idb=null;
const $=s=>document.querySelector(s);
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==='class')e.className=v;else if(a.startsWith('on'))e.addEventListener(a.slice(2),v);else if(a in e)e[a]=v;else e.setAttribute(a,v)}for(const c of k.flat())if(c!=null)e.append(c);return e};
const norm=s=>(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const kws=s=>s.split(/[,،\n]/).map(x=>x.trim()).filter(Boolean);
function subj(t){const m=(t||'').match(/(?:الموضوع|العنوان|م\s*\/)\s*[:：\-–\/]?\s*([^\n]{3,120})/);return m?m[1].trim():''}

const dig=s=>(s||'').replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776);
function meta(t){t=dig(t);const n=t.match(/(?:العدد|رقم الكتاب|الرقم|No\.?|Ref\.?)\s*[:：\-–]?\s*([0-9][0-9\/\-.]*)/i),d=t.match(/(?:التاريخ|التأريخ|Date)\s*[:：\-–]?\s*([0-9]{1,4}\s*[\/\-.]\s*[0-9]{1,2}\s*[\/\-.]\s*[0-9]{1,4})/i);return{num:n?n[1].replace(/[\/\-.]+$/,''):'',dt:d?d[1].replace(/\s/g,''):''}}
const ts=s=>{const p=dig(s).split(/[\/\-.]/).map(Number);if(p.length<3||p.some(isNaN))return 0;let[a,b,c]=p;if(a>31)return new Date(a,b-1,c).getTime();if(c<100)c+=2000;return new Date(c,b-1,a).getTime()};
const nk=s=>dig(s).split(/[^0-9]+/).filter(Boolean).map(Number);
const vis=s=>{const t=dig(String(s||'')).replace(/\s+/g,'').replace(/[\\|]/g,'/'),p=t.split('/').filter(x=>x!=='');return p.length&&p.every(x=>/^\d+$/.test(x))?p.reverse().join('/'):dig(String(s||'')).trim()};
function fixDate(s){const p=dig(s).replace(/\s/g,'').split(/[\/\-.]/);if(p.length===3&&p.every(x=>/^\d+$/.test(x))){if(+p[0]>31)p.reverse();if(+p[1]>12&&+p[0]<=12)[p[0],p[1]]=[p[1],p[0]];const y=p[2];if(y.length===3&&y[0]==='2'&&y[1]!=='0')p[2]='20'+y.slice(1);else if(y.length===2)p[2]='20'+y;return p.join('/')}return dig(s).trim()}
function fixNum(s){const t=dig(s).replace(/\s/g,''),p=t.split(/[\/\-.]/);if((p.length===3||p.length===2)&&p.every(x=>/^\d+$/.test(x))){if(p[0].length>p[p.length-1].length)p.reverse();return p.join('/')}return dig(s).trim()}
function anyDate(t){for(const m of dig(t||'').matchAll(/([0-9]{1,4})\s*[\/\-.]\s*([0-9]{1,2})\s*[\/\-.]\s*([0-9]{1,4})/g)){const d=fixDate(m[0]),p=d.split('/').map(Number);if(p[2]>=1990&&p[2]<=2100&&p[1]>=1&&p[1]<=12&&p[0]>=1&&p[0]<=31)return d}return''}
function cmpD(x,y){const dx=ts(x.dt),dy=ts(y.dt);if(dx&&dy&&dx!==dy)return dx-dy;if(!dx!==!dy)return dx?-1:1;return cmp(x,y)}
const srt=()=>sortBy==='date'?cmpD:cmp;
function cmp(x,y){if(x.num&&y.num){const a=nk(x.num).reverse(),b=nk(y.num).reverse();for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]??-1)-(b[i]??-1);if(d)return d}return 0}if(!x.num!==!y.num)return x.num?-1:1;const dx=ts(x.dt),dy=ts(y.dt);if(dx||dy)return(dx||Infinity)-(dy||Infinity);return x.at-y.at}

/* التخزين على الهاتف */
function dbOpen(){return new Promise(r=>{try{const o=indexedDB.open('arch',1);o.onupgradeneeded=()=>o.result.createObjectStore('docs',{keyPath:'id'});o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(e){r(null)}})}
const tx=(m,f)=>new Promise(r=>{if(!idb)return r(null);try{const t=idb.transaction('docs',m),q=f(t.objectStore('docs'));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>r(null)}catch(e){r(null)}});
const put=d=>tx('readwrite',s=>s.put(d)),del=id=>tx('readwrite',s=>s.delete(id));
function saveCats(){try{localStorage.setItem('cats',JSON.stringify(cats))}catch(e){}}
async function init(){
 try{const c=JSON.parse(localStorage.getItem('cats'));cats=Array.isArray(c)&&c.length?c:structuredClone(DEF)}catch(e){cats=structuredClone(DEF)}
 idb=await dbOpen();hGet().then(async h=>{if(!h)return;savedDir=h;try{if(await h.queryPermission({mode:'readwrite'})==='granted'){localDir=h;render()}}catch(e){}});docs=((await tx('readonly',s=>s.getAll()))||[]);docs.forEach(d=>{if(d.num===undefined){const m=meta(d.text);d.num=m.num;d.dt=m.dt;put(d)}if(!d.dt){const a=anyDate(d.text);if(a){d.dt=a;put(d)}}});render()}

/* التصنيف بالكلمات المفتاحية */
function classify(t){const n=norm(t);let b='',bs=0;for(const c of cats){let s=0;for(const k of c.kw){const w=norm(k);if(w&&n.includes(w))s++}if(s>bs){bs=s;b=c.name}}return b||NONE}

async function loadImg(f){
 try{return await createImageBitmap(f)}catch(e){}
 const u=await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>j(new Error('تعذّرت قراءة الملف'));fr.readAsDataURL(f)});
 return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>j(new Error('صيغة الصورة غير مدعومة'));i.src=u})}
async function shrink(f){return shrinkSrc(await loadImg(f))}
async function shrinkSrc(i){
 const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');
 c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));{const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(i,0,0,c.width,c.height)}
 const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.7));if(!b)throw new Error('تعذّر تجهيز الصورة');
 const hw=Math.round(i.width*.55),hh=Math.round(i.height*.25),hk=Math.min(2,1400/hw),hb=[];
 for(const sx of[i.width-hw,0]){const hc=document.createElement('canvas');hc.width=Math.max(1,Math.round(hw*hk));hc.height=Math.max(1,Math.round(hh*hk));hc.getContext('2d').drawImage(i,sx,0,hw,hh,0,0,hc.width,hc.height);hb.push(await new Promise(r=>hc.toBlob(r,'image/jpeg',.9)))}
 const bh=Math.round(i.height*.25),bk=Math.min(1,1000/i.width),bc=document.createElement('canvas');
 bc.width=Math.max(1,Math.round(i.width*bk));bc.height=Math.max(1,Math.round(bh*bk));
 {const g=bc.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,bc.width,bc.height);g.drawImage(i,0,0,i.width,bh,0,0,bc.width,bc.height)}
 return{blob:b,head:hb,url:c.toDataURL('image/jpeg',.7),hdr:bc.toDataURL('image/jpeg',.65)}}
function shrinkOld(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res({blob:b,url:c.toDataURL('image/jpeg',.7)}):rej(),'image/jpeg',.7)};i.onerror=rej;i.src=u})}

  h('div',{class:'card mut'},'تُعالَج الملفات واحدًا بعد الآخر، ويمكنك إضافة ملفات أخرى أثناء المعالجة. اختيار المجلد قد لا يعمل على بعض الهواتف، فاستخدم عندها اختيار عدة ملفات. ملف PDF يُعامَل مستندًا واحدًا، وتُقرأ أول 3 صفحات منه.'),qEl);
 drawQ();return w}

function detail(){
 const d=docs.find(x=>x.id===openId);if(!d){openId=null;return listView()}
 const sel=h('select',{onchange:e=>{d.cat=e.target.value;d.manual=true;put(d);schedSync(d)}},...[...new Set([NONE,...cats.map(c=>c.name),d.cat])].map(c=>h('option',{value:c,selected:c===d.cat},c)));
 let confirm=false;const delb=h('button',{class:'bad',onclick:async()=>{
  if(!confirm){confirm=true;delb.textContent='سيُحذف من التطبيق'+(d.drive?' ومن Drive (إلى السلة)':'')+(d.sheet?' ومن الجدول (الصف كاملًا)':'')+' — اضغط للتأكيد';return}
  delb.disabled=true;delb.textContent='جارٍ الحذف…';
  docs=docs.filter(x=>x!==d);await del(d.id);const er=await delRemote(d);
  flash=er.length?'حُذف من التطبيق، لكن تعذّر حذف: '+er.join('، ')+'. احذفه يدويًا.':'تم الحذف'+(d.drive||d.sheet?' من التطبيق وDrive والجدول':'');
  openId=null;render()}},'حذف المستند');
 return h('div',{},h('button',{class:'sec',onclick:()=>{openId=null;render()}},'← رجوع'),h('img',{class:'full',src:d.img,alt:d.title}),
  h('div',{class:'card'},h('h2',{},'الموضوع'),h('input',{value:d.title,onchange:e=>{d.title=e.target.value;put(d);schedSync(d)}}),d.hdr?h('img',{class:'full',src:d.hdr,alt:'أعلى المستند'}):null,h('p',{class:'mut',style:'margin:0'},'قارن العدد والتاريخ بالصورة أعلاه وصحّحهما إن لزم:'),h('h2',{style:'margin-top:12px'},'رقم العدد'),h('input',{dir:'ltr',value:d.num||'',onchange:e=>{d.num=dig(e.target.value).trim();put(d);schedSync(d)}}),h('h2',{style:'margin-top:12px'},'التاريخ'),h('input',{dir:'ltr',value:d.dt||'',placeholder:'مثال: 15/10/2026',onchange:e=>{d.dt=dig(e.target.value).trim();put(d);schedSync(d)}}),h('h2',{style:'margin-top:12px'},'التصنيف'),sel),
  h('div',{class:'card'},h('h2',{},'النص المستخرج'),h('textarea',{value:d.text,onchange:e=>{d.text=e.target.value;if(!d.manual){d.cat=classify(d.title+' '+d.text);sel.value=d.cat}put(d);schedSync(d)}})),metaCard(d),localCard(d),delb)}

function catsView(){
 const w=h('div'),msg=h('div',{class:'mut',role:'status'});
 w.append(h('p',{class:'mut'},'افصل الكلمات بفاصلة. يُختار التصنيف الذي تتكرر كلماته أكثر في المستند. بعد التعديل اضغط «إعادة التصنيف» لتطبيقه على المستندات القديمة.'));
 cats.forEach((c,i)=>w.append(h('div',{class:'card'},
  h('input',{value:c.name,'aria-label':'اسم التصنيف',onchange:e=>{const v=e.target.value.trim();if(v){c.name=v;saveCats()}else e.target.value=c.name}}),
  h('textarea',{value:c.kw.join('، '),'aria-label':'الكلمات المفتاحية',style:'margin-top:8px',onchange:e=>{c.kw=kws(e.target.value);saveCats()}}),
  h('button',{class:'bad',style:'margin-top:8px',onclick:()=>{cats.splice(i,1);saveCats();render()}},'حذف التصنيف'))));
 w.append(h('div',{class:'row'},
  h('button',{class:'sec',onclick:()=>{cats.push({name:'تصنيف جديد',kw:[]});saveCats();render();scrollTo(0,document.body.scrollHeight)}},'+ تصنيف جديد'),
  h('button',{onclick:async()=>{let n=0;for(const d of docs){if(d.manual||!d.text)continue;const c=classify(d.title+' '+d.text);if(c!==d.cat){d.cat=c;n++;await put(d);schedSync(d)}}msg.textContent=n?'تمت إعادة تصنيف '+n+' مستند.':'لا تغييرات.'}},'إعادة التصنيف')),
  msg,h('button',{class:'sec',style:'margin-top:14px',onclick:()=>{cats=structuredClone(DEF);saveCats();render()}},'استعادة التصنيفات الأصلية'));
 w.append(geminiCard(),localSettings());
 return w}
init();
